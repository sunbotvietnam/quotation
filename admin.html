<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sunbot Price Admin</title>
<style>
:root{--cam:#f36f21;--navy:#12213d;--ink:#1d2939;--muted:#667085;--line:#e4e7ec;--bg:#f7f8fa;--ok:#067647;--warn:#b54708;--bad:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.wrap{max-width:1240px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:12px;background:var(--cam);color:#fff;display:grid;place-items:center;font-weight:900}.brand h1{margin:0;font-size:20px;color:var(--navy)}.brand small{display:block;color:var(--muted);margin-top:3px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 6px 22px rgba(16,24,40,.05)}.login{max-width:440px;margin:9vh auto}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:10px 12px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:750;cursor:pointer;background:var(--cam);color:#fff}.btn.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.warn{background:#fff7ed;color:var(--warn);border:1px solid #fed7aa}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer}.tab.active{background:var(--navy);color:#fff}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.metric b{display:block;font-size:24px;color:var(--navy)}.list{display:grid;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.head h3{margin:0 0 5px;color:var(--navy);font-size:18px}.muted{color:var(--muted);font-size:13px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:750;background:#fff3e8;color:var(--warn)}.pill.ok{background:#ecfdf3;color:var(--ok)}.pill.bad{background:#fef3f2;color:var(--bad)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}.grid .field{margin:0}.source{margin-top:12px;padding:12px;border-radius:12px;background:#f8fafc;border:1px solid var(--line);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.history{overflow:auto}.history table{width:100%;border-collapse:collapse;min-width:900px}.history th,.history td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}.empty{text-align:center;color:var(--muted);padding:30px}.bridge-frame,.bridge-form{display:none}.busy:after{content:'Đang xử lý…';position:fixed;right:20px;bottom:20px;background:var(--navy);color:#fff;padding:10px 14px;border-radius:10px}.notice{padding:12px 14px;border-radius:12px;background:#fffaeb;border:1px solid #fedf89;color:#7a2e0e;margin-bottom:14px}@media(max-width:900px){.grid,.metrics{grid-template-columns:1fr}.wrap{padding:14px}.head{display:block}}
</style>
</head>
<body><div id="app"></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbw32BGSXwFVOpRCknx5hn8-k2m5ZXox26_y2mnZKVWL0JKHCv_Qtly5JiY0FS9e87kU/exec';
const SESSION_KEY='sunbot_ops_pages_session_v1',EMAIL_KEY='sunbot_ops_pages_email_v1',app=document.getElementById('app'),pending=new Map();
let state={token:sessionStorage.getItem(SESSION_KEY)||'',email:sessionStorage.getItem(EMAIL_KEY)||'',boot:null,data:null,filter:'PENDING',tab:'prices'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>Number(v||0).toLocaleString('vi-VN');
function setBusy(v){document.body.classList.toggle('busy',!!v)}function reqId(){return 'pa'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
window.addEventListener('message',ev=>{if(!(ev.origin==='https://script.google.com'||ev.origin.endsWith('.googleusercontent.com')))return;const d=ev.data||{};if(d.type!=='sunbot-pages-response'||!d.requestId)return;const p=pending.get(d.requestId);if(!p)return;pending.delete(d.requestId);p.frame.remove();clearTimeout(p.timer);d.ok?p.resolve(d.result):p.reject(new Error(d.error||'Có lỗi xảy ra.'));});
function bridge(mode,subaction,payload={},token=state.token){return new Promise((resolve,reject)=>{const id=reqId(),frame=document.createElement('iframe');frame.name='pab_'+id;frame.className='bridge-frame';document.body.appendChild(frame);const timer=setTimeout(()=>{pending.delete(id);frame.remove();reject(new Error('Kết nối máy chủ quá thời gian.'));},25000);pending.set(id,{resolve,reject,frame,timer});const form=document.createElement('form');form.method='POST';form.action=API_URL;form.target=frame.name;form.className='bridge-form';const fields={action:'pagesBridge',request_id:id,mode,subaction:subaction||'',token:token||'',payload:JSON.stringify(payload||{})};Object.entries(fields).forEach(([k,v])=>{const i=document.createElement('input');i.type='hidden';i.name=k;i.value=v;form.appendChild(i)});document.body.appendChild(form);form.submit();form.remove();});}
async function call(mode,sub,payload={},token=state.token){setBusy(true);try{return await bridge(mode,sub,payload,token)}finally{setBusy(false)}}
function loginView(msg=''){app.innerHTML=`<div class="wrap"><section class="panel login"><div class="brand"><div class="logo">S</div><div><h1>SUNBOT PRICE ADMIN</h1><small>Backend duyệt giá dành cho CEO/Admin</small></div></div><div class="field"><label>Email</label><input id="email" type="email" value="${esc(state.email)}"></div><div class="field"><label>PIN 6 số</label><input id="pin" type="password" inputmode="numeric" maxlength="6"></div><button class="btn" id="login">Đăng nhập</button>${msg?`<p style="color:#b42318">${esc(msg)}</p>`:''}</section></div>`;document.getElementById('login').onclick=login;}
async function login(){const email=String(document.getElementById('email').value||'').trim().toLowerCase(),pin=String(document.getElementById('pin').value||'').trim();try{const r=await call('pinLogin','',{email,pin},'');state.token=r.token;state.email=email;sessionStorage.setItem(SESSION_KEY,r.token);sessionStorage.setItem(EMAIL_KEY,email);await load();}catch(e){loginView(e.message)}}
function logout(){sessionStorage.removeItem(SESSION_KEY);sessionStorage.removeItem(EMAIL_KEY);state.token='';loginView()}
async function load(){if(!state.token)return loginView();try{state.boot=await call('quotation','bootstrap',{});if(!state.boot.rights?.canApprovePrice)throw new Error('Tài khoản này không có quyền duyệt bảng giá.');await refresh();}catch(e){loginView(e.message)}}
async function refresh(){state.data=await call('quotation','adminList',{status:state.filter});render();}
function decisionPill(d){d=String(d||'').toUpperCase();if(d==='DUYỆT DÙNG')return '<span class="pill ok">ĐÃ DUYỆT</span>';if(d==='KHÔNG DÙNG')return '<span class="pill bad">KHÔNG DÙNG</span>';return '<span class="pill">CHỜ DUYỆT</span>'}
function render(){const u=state.boot.user||{},d=state.data||{},all=[...(d.packages||[]),...(d.items||[])],pendingN=all.filter(x=>!['DUYỆT DÙNG','KHÔNG DÙNG'].includes(String(x.decision||'').toUpperCase())).length,approvedN=all.filter(x=>String(x.decision||'').toUpperCase()==='DUYỆT DÙNG').length,rejectedN=all.filter(x=>String(x.decision||'').toUpperCase()==='KHÔNG DÙNG').length;app.innerHTML=`<div class="wrap"><header class="top"><div class="brand"><div class="logo">S</div><div><h1>SUNBOT PRICE ADMIN</h1><small>${esc(u.ho_ten||u.email||'')} · CEO/Admin</small></div></div><div><a class="btn secondary" href="v2.html">App báo giá</a> <button class="btn secondary" id="logout">Đăng xuất</button></div></header><div class="notice">Đây là nơi phê duyệt <b>bảng giá gốc</b>, không phải nơi duyệt từng báo giá cho khách hàng.</div><div class="metrics"><div class="metric"><span>Chờ duyệt</span><b>${pendingN}</b></div><div class="metric"><span>Đã duyệt</span><b>${approvedN}</b></div><div class="metric"><span>Không dùng</span><b>${rejectedN}</b></div></div><div class="toolbar"><button class="tab ${state.tab==='prices'?'active':''}" data-tab="prices">Duyệt giá</button><button class="tab ${state.tab==='history'?'active':''}" data-tab="history">Nhật ký quyết định</button>${state.tab==='prices'?`<span style="width:12px"></span><button class="tab ${state.filter==='PENDING'?'active':''}" data-filter="PENDING">Chờ duyệt</button><button class="tab ${state.filter==='APPROVED'?'active':''}" data-filter="APPROVED">Đã duyệt</button><button class="tab ${state.filter==='REJECTED'?'active':''}" data-filter="REJECTED">Không dùng</button><button class="tab ${state.filter==='ALL'?'active':''}" data-filter="ALL">Tất cả</button>`:''}</div><main id="content"></main></div>`;document.getElementById('logout').onclick=logout;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.tab==='history'?renderHistory():render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=async()=>{state.filter=b.dataset.filter;await refresh()});state.tab==='history'?renderHistory():renderPrices();}
function renderPrices(){const rows=[...(state.data?.packages||[]),...(state.data?.items||[])],el=document.getElementById('content');if(!rows.length){el.innerHTML='<div class="panel empty">Không có mức giá trong nhóm này.</div>';return}el.innerHTML=`<div class="list">${rows.map(card).join('')}</div>`;rows.forEach(x=>{document.getElementById('approve_'+x.entity_id).onclick=()=>saveDecision(x,'DUYỆT DÙNG');document.getElementById('review_'+x.entity_id).onclick=()=>saveDecision(x,'CẦN XÁC NHẬN');document.getElementById('reject_'+x.entity_id).onclick=()=>saveDecision(x,'KHÔNG DÙNG');});}
function card(x){const id=esc(x.entity_id),source=x.source||{};return `<article class="card"><div class="head"><div><h3>${esc(x.name)}</h3><div class="muted">${x.entity_type==='PACKAGE'?'Gói giá':'Hạng mục'} · ${id} · ${esc(x.scope||x.audience||'')}</div></div>${decisionPill(x.decision)}</div><div class="grid"><div class="field"><label>Giá chưa VAT</label><input id="price_${id}" inputmode="numeric" value="${money(x.price_before_tax)}"></div><div class="field"><label>Giá thanh toán</label><input id="payment_${id}" inputmode="numeric" value="${money(x.payment_price)}"></div><div class="field"><label>Mức tin cậy</label><input value="${esc(x.confidence||'')}" disabled></div><div class="field"><label>Trạng thái nguồn</label><input value="${esc(x.price_status||'')}" disabled></div></div><div class="source"><b>Nguồn:</b> ${esc(x.source_id||'Chưa gắn nguồn')}<br>${esc(source['Tên nguồn']||source['Tên tài liệu']||source['Mô tả']||'')} ${x.note?`<br><b>Lưu ý:</b> ${esc(x.note)}`:''}</div><div class="field"><label>Ghi chú quyết định của CEO</label><textarea id="note_${id}" rows="2" placeholder="Ví dụ: Duyệt áp dụng từ 15/08/2026; chưa gồm vận chuyển...">${esc(x.note||'')}</textarea></div><div class="actions"><button class="btn ok" id="approve_${id}">DUYỆT DÙNG</button><button class="btn warn" id="review_${id}">CẦN XÁC MINH THÊM</button><button class="btn bad" id="reject_${id}">KHÔNG DÙNG</button></div></article>`}
function parseMoney(v){return Number(String(v||'').replace(/[^0-9-]/g,''))||0}
async function saveDecision(x,decision){if(!confirm(`${decision}: ${x.name}?`))return;try{await call('quotation','adminUpdatePrice',{entity_type:x.entity_type,entity_id:x.entity_id,price_before_tax:parseMoney(document.getElementById('price_'+x.entity_id).value),payment_price:parseMoney(document.getElementById('payment_'+x.entity_id).value),decision,decision_note:document.getElementById('note_'+x.entity_id).value||''});await refresh();}catch(e){alert(e.message)}}
async function renderHistory(){const el=document.getElementById('content');if(!el)return;el.innerHTML='<div class="panel empty">Đang tải nhật ký…</div>';try{const rows=await call('quotation','adminPriceHistory',{});if(!rows.length){el.innerHTML='<div class="panel empty">Chưa có quyết định giá nào được ghi nhận.</div>';return}el.innerHTML=`<div class="panel history"><table><thead><tr><th>Thời điểm</th><th>Người duyệt</th><th>Loại</th><th>Mã</th><th>Giá cũ</th><th>Giá mới</th><th>Quyết định</th><th>Ghi chú</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r['Thời điểm'])}</td><td>${esc(r['Người duyệt'])}</td><td>${esc(r['Loại'])}</td><td>${esc(r['Mã giá'])}</td><td>${money(parseMoney(r['Giá cũ chưa VAT']))}</td><td>${money(parseMoney(r['Giá mới chưa VAT']))}</td><td>${esc(r['Quyết định mới'])}</td><td>${esc(r['Ghi chú quyết định'])}</td></tr>`).join('')}</tbody></table></div>`}catch(e){el.innerHTML=`<div class="notice">${esc(e.message)}</div>`}}
load();
</script></body></html>
