<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hệ thống báo giá Sunbot V2</title>
<meta name="description" content="Hệ thống báo giá Sunbot sử dụng dữ liệu giá đã kiểm soát trên Google Sheet.">
<style>
:root{--cam:#f36f21;--cam2:#d95a12;--navy:#12213d;--ink:#1d2939;--muted:#667085;--line:#e4e7ec;--bg:#f7f8fa;--ok:#067647;--warn:#b54708;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:12px;background:var(--cam);color:white;display:grid;place-items:center;font-weight:900;font-size:21px}.brand h1{font-size:20px;margin:0;color:var(--navy)}.brand small{display:block;color:var(--muted);margin-top:3px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 6px 22px rgba(16,24,40,.05)}.login{max-width:440px;margin:9vh auto}.login h2{margin:0 0 8px}.login p{color:var(--muted);line-height:1.5}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:11px 12px;background:white}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:750;cursor:pointer;background:var(--cam);color:white}.btn.secondary{background:white;color:var(--navy);border:1px solid var(--line)}.btn.ghost{background:#f2f4f7;color:var(--ink)}.btn:disabled{opacity:.5;cursor:not-allowed}.header-actions{display:flex;gap:8px;align-items:center}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-bottom:18px}.hero h2{font-size:30px;margin:0 0 8px;color:var(--navy)}.hero p{margin:0;color:var(--muted);line-height:1.55}.statusbox{background:var(--navy);color:white;border-radius:18px;padding:20px}.statusbox small{color:#d0d5dd}.statusbox strong{display:block;font-size:24px;margin:8px 0}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:750;background:#fff3e8;color:var(--warn)}.pill.ok{background:#ecfdf3;color:var(--ok)}.pill.bad{background:#fef3f2;color:var(--bad)}.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:white;border-radius:999px;padding:9px 13px;cursor:pointer}.tab.active{background:var(--navy);color:white;border-color:var(--navy)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:17px}.card h3{margin:9px 0 6px;font-size:17px;color:var(--navy)}.card p{margin:5px 0;color:var(--muted);font-size:13px;line-height:1.45}.price{font-size:24px;font-weight:850;color:var(--navy);margin:12px 0}.meta{display:flex;gap:6px;flex-wrap:wrap}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.quote-summary{background:#fff8ef;border:1px solid #fed7aa;border-radius:14px;padding:16px;margin-top:15px}.quote-summary .row{display:flex;justify-content:space-between;gap:14px;padding:6px 0}.quote-summary .total{font-size:19px;font-weight:850;border-top:1px solid #fdba74;margin-top:7px;padding-top:12px}.notice{padding:13px 15px;border-radius:12px;background:#fffaeb;color:#7a2e0e;border:1px solid #fedf89;margin-bottom:16px;line-height:1.45}.notice.ok{background:#ecfdf3;color:#05603a;border-color:#abefc6}.empty{text-align:center;color:var(--muted);padding:35px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:var(--muted);font-size:12px}.money{white-space:nowrap;font-weight:750}.hidden{display:none!important}.bridge-frame,.bridge-form{display:none}.busy:after{content:'Đang xử lý…';position:fixed;right:20px;bottom:20px;background:var(--navy);color:white;padding:10px 14px;border-radius:10px;z-index:20}.footer{color:var(--muted);font-size:12px;margin-top:22px;text-align:center}@media(max-width:850px){.hero,.two{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.wrap{padding:14px}}
</style>
</head>
<body>
<div id="app"></div>
<script src="pricebook-v2.js"></script>
</body>
</html>
